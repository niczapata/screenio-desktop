<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Elegir qué compartir</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg:#f4f5f7; --panel:#fff; --fg:#1a1d21; --muted:#667085;
        --border:#e3e6ea; --accent:#1a73e8; --accent-fg:#fff; --sel:#e8f0fe;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#16181c; --panel:#1e2126; --fg:#e8eaed; --muted:#9aa0a6;
                --border:#2c3036; --accent:#4c8df6; --accent-fg:#0b0d10; --sel:#1f2b3d; }
      }
      * { box-sizing:border-box; }
      body { margin:0; height:100vh; display:flex; flex-direction:column;
             background:var(--bg); color:var(--fg);
             font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
      header { padding:18px 22px 0; }
      h1 { margin:0 0 3px; font-size:16px; font-weight:600; letter-spacing:-0.01em; }
      .sub { margin:0; color:var(--muted); font-size:13px; }
      .tabs { display:flex; gap:6px; padding:14px 22px 0; }
      .tab { font:inherit; font-weight:550; padding:7px 15px; border-radius:7px;
             border:1px solid transparent; background:transparent; color:var(--muted); cursor:pointer; }
      .tab[aria-selected="true"] { background:var(--panel); border-color:var(--border); color:var(--fg); }
      main { flex:1; overflow-y:auto; padding:14px 22px; }
      .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
      .card { border:1px solid var(--border); border-radius:10px; background:var(--panel);
              padding:8px; cursor:pointer; text-align:left; font:inherit; color:inherit;
              display:flex; flex-direction:column; gap:8px; transition:border-color .12s, background .12s; }
      .card:hover { border-color:var(--accent); }
      .card[aria-selected="true"] { border-color:var(--accent); background:var(--sel);
              box-shadow:0 0 0 1px var(--accent) inset; }
      .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      .thumb { width:100%; aspect-ratio:16/9; object-fit:contain; border-radius:6px;
               background:rgba(128,128,128,.14); display:block; }
      .label { display:flex; align-items:center; gap:7px; min-width:0; }
      .label img { width:16px; height:16px; flex:none; }
      .label span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
      .empty { color:var(--muted); text-align:center; padding:48px 0; font-size:13px; }
      footer { display:flex; justify-content:flex-end; gap:9px; padding:14px 22px;
               border-top:1px solid var(--border); background:var(--panel); }
      button.action { font:inherit; font-weight:550; padding:9px 20px; border-radius:8px;
               border:1px solid var(--border); background:transparent; color:var(--fg); cursor:pointer; }
      button.primary { background:var(--accent); color:var(--accent-fg); border-color:transparent; }
      button.primary:disabled { opacity:.5; cursor:default; }
    </style>
  </head>
  <body>
    <header>
      <h1>Elegir qué compartir</h1>
      <p class="sub">Scre.io quiere grabar el contenido de tu pantalla.</p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-kind="screen" aria-selected="true">Pantalla completa</button>
      <button class="tab" role="tab" data-kind="window" aria-selected="false">Ventana</button>
    </div>

    <main><div class="grid" id="grid" role="listbox" aria-label="Fuentes disponibles"></div></main>

    <footer>
      <button class="action" id="cancel" type="button">Cancelar</button>
      <button class="action primary" id="share" type="button" disabled>Compartir</button>
    </footer>

    <script>
      const grid = document.getElementById('grid');
      const shareBtn = document.getElementById('share');
      const tabs = [...document.querySelectorAll('.tab')];
      let sources = [], kind = 'screen', selected = null;

      const visible = () => sources.filter(s => s.kind === kind);

      function render() {
        grid.innerHTML = '';
        const items = visible();
        if (!items.length) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = kind === 'screen' ? 'No se detectaron pantallas.' : 'No hay ventanas abiertas para compartir.';
          grid.append(p);
          return;
        }
        for (const s of items) {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'card';
          card.role = 'option';
          card.setAttribute('aria-selected', String(s.id === selected));

          const img = document.createElement('img');
          img.className = 'thumb';
          img.alt = '';
          if (s.thumbnail) img.src = s.thumbnail;
          card.append(img);

          const label = document.createElement('div');
          label.className = 'label';
          if (s.appIcon) { const i = document.createElement('img'); i.src = s.appIcon; i.alt = ''; label.append(i); }
          const span = document.createElement('span');
          span.textContent = s.name;
          span.title = s.name;
          label.append(span);
          card.append(label);

          card.addEventListener('click', () => { selected = s.id; render(); });
          card.addEventListener('dblclick', () => { selected = s.id; confirmShare(); });
          grid.append(card);
        }
        shareBtn.disabled = !selected || !items.some(s => s.id === selected);
      }

      function setKind(next) {
        kind = next;
        selected = null;
        for (const t of tabs) t.setAttribute('aria-selected', String(t.dataset.kind === next));
        render();
      }

      function confirmShare() { if (selected) window.picker.choose(selected); }

      tabs.forEach(t => t.addEventListener('click', () => setKind(t.dataset.kind)));
      shareBtn.addEventListener('click', confirmShare);
      document.getElementById('cancel').addEventListener('click', () => window.picker.cancel());
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') window.picker.cancel();
        if (e.key === 'Enter' && selected) confirmShare();
      });

      window.picker.getSources().then(list => {
        sources = list;
        // Open on whichever tab actually has something in it.
        setKind(list.some(s => s.kind === 'screen') ? 'screen' : 'window');
      }).catch(err => {
        grid.innerHTML = '<p class="empty">No se pudieron enumerar las fuentes: ' + err.message + '</p>';
      });
    </script>
  </body>
</html>
